services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: konatech_attendance_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?POSTGRES_TEST_PASSWORD must be set}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - konatech-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d konatech_attendance_e2e']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  konatech-test-postgres-data:
    name: konatech-test-postgres-data
