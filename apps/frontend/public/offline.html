<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#10323c" />
    <title>InOut — Hors connexion</title>
  </head>
  <body
    style="
      margin: 0;
      background: #fffdfb;
      color: #10323c;
      font-family: system-ui, sans-serif;
    "
  >
    <main
      style="
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      "
    >
      <section style="max-width: 420px">
        <img src="/brand/inout-logo.png" alt="InOut" width="180" />
        <h1>Mode hors connexion</h1>
        <p>
          Les pointages déjà placés en attente seront synchronisés au retour de
          la connexion.
        </p>
        <p>
          <strong
            >Un pointage en attente n’est pas encore validé par le
            serveur.</strong
          >
        </p>
      </section>
    </main>
    <script>
      window.addEventListener('online', () => window.location.reload());
    </script>
  </body>
</html>
